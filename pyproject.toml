[project]
name = "pyramid-introspector"
version = "0.1.1"
description = "A library that helps introspect Pyramid views and extract their metadata and information."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "pyramid",
    "setuptools<78",
]

[project.optional-dependencies]
cornice = ["cornice", "marshmallow"]

[project.entry-points."pyramid_introspector.extensions"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyramid_introspector"]

[tool.ruff]
src = ["src"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM", "TCH"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "ruff",
    "black",
    "pytest",
    "mkdocs-material",
    "cornice",
    "marshmallow",
    "webtest",
]
